name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Official Playwright image: Chromium and its system libraries are already installed,
    # so the run does not depend on a browser download. Keep the tag in step with package.json.
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
        env:
          HOME: /root
